<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, user-scalable=yes" />
    <meta name="google-site-verification" content="google5cae5f59121804b5" />
    <meta name="google-site-verification" content="google5cae5f59121804b5.html" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BharatSeva" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1532375810709-75b1da00537c?w=192&auto=format&fit=crop&q=80" />
    <title>BharatSeva - Unified Citizen Services, Jobs, Exams & Scholarships Portal</title>
    
    <!-- DNS prefetch & Preconnect for maximum speed -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Inline Critical Style for Instant Initial Render -->
    <style>
      .app-initial-shell {
        min-height: 100vh;
        background-color: #f8fafc;
        display: flex;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-initial-nav {
        height: 64px;
        background: #0f172a;
        color: white;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
      }
      .app-initial-logo {
        width: 32px;
        height: 32px;
        background: #0d9488;
        border-radius: 8px;
      }
      .app-initial-title {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.5px;
      }
      .app-initial-body {
        max-width: 1200px;
        width: 100%;
        margin: 20px auto;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .app-initial-hero {
        height: 140px;
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border-radius: 20px;
        animation: initialPulse 1.2s infinite alternate ease-in-out;
      }
      .app-initial-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }
      .app-initial-card {
        height: 120px;
        background: #ffffff;
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        animation: initialPulse 1.2s infinite alternate ease-in-out;
      }
      @keyframes initialPulse {
        0% { opacity: 0.6; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root">
      <!-- Instant First Paint Shell (Replaced seamlessly once React boots) -->
      <div class="app-initial-shell">
        <div class="app-initial-nav">
          <div class="app-initial-logo"></div>
          <div>
            <div class="app-initial-title">BharatSeva</div>
            <div style="font-size: 10px; color: #94a3b8;">Loading Portal & Live Data...</div>
          </div>
        </div>
        <div class="app-initial-body">
          <div class="app-initial-hero"></div>
          <div class="app-initial-grid">
            <div class="app-initial-card"></div>
            <div class="app-initial-card"></div>
            <div class="app-initial-card"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
